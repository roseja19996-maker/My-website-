<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLAS Creator Studio</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #292929;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      color: #aaa;
      margin-top: 8px;
    }

    .studio {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    .upload-box {
      border: 2px dashed #555;
      border-radius: 16px;
      padding: 45px 20px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 25px;
    }

    .upload-box:hover {
      border-color: white;
    }

    input[type="file"] {
      display: none;
    }

    #preview {
      display: none;
      max-width: 100%;
      max-height: 400px;
      margin: 20px auto;
      border-radius: 12px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      box-sizing: border-box;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #151515;
      color: white;
      font-size: 16px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ddd;
    }

    #status {
      text-align: center;
      color: #aaa;
      margin-top: 18px;
    }
  </style>
</head>

<body>

  <header>
    <h1>OLAS Creator</h1>
    <p>Studio</p>
  </header>

  <main class="studio">

    <label class="upload-box" for="imageInput">
      <h2>Upload an image</h2>
      <p>Tap here to choose a picture</p>
    </label>

    <input id="imageInput" type="file" accept="image/*">

    <img id="preview" alt="Image preview">

    <textarea
      id="prompt"
      placeholder="Describe what you want OLAS to change...">
    </textarea>

    <button onclick="editImage()">Edit Image</button>

    <p id="status"></p>

  </main>

  <script>
    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");

    imageInput.addEventListener("change", function () {
      const file = this.files[0];

      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
        status.textContent = "Image loaded successfully.";
      }
    });

    function editImage() {
      const prompt = document.getElementById("prompt").value.trim();

      if (!imageInput.files[0]) {
        status.textContent = "Please upload an image first.";
        return;
      }

      if (!prompt) {
        status.textContent = "Please describe the edit you want.";
        return;
      }

      status.textContent =
        "OLAS received your image and editing instructions. AI editing will be connected next.";
    }
  </script>

</body>
</html>
