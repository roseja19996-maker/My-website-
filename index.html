<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLAS Creator</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#050507;
  --panel:#0d0d12;
  --panel2:#111118;
  --border:#24242d;
  --text:#ffffff;
  --muted:#9b9ba6;
  --accent:#8b5cf6;
  --accent2:#a78bfa;
  --success:#22c55e;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:115px;
  border-right:1px solid var(--border);
  min-height:100vh;
  padding:25px 18px;
  position:fixed;
  left:0;
  top:0;
  background:#060609;
  z-index:20;
}

.logo{
  width:58px;
  height:58px;
  border:1px solid #33333c;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-size:25px;
  font-weight:900;
  background:#101015;
}

.nav{
  margin-top:55px;
  display:flex;
  flex-direction:column;
  gap:22px;
}

  width:100%;
  min-height:62px;
